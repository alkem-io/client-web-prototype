<title>Cookie Banner Mobile</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!-- Review board for alkem-io/product#2233. Backdrops are screenshots of the prototype; banner, sheet and section are live. -->

<style>
/* Layout: three rows of true-to-scale screens, short captions only. Screens are light only, as the platform is. */
:root {
  --board: #e9eef2; --ink: #1d384a; --ink-soft: #566779; --rule: #cfd8e0; --pick: #0b7285; --bezel: #16242f;
  --background: #fcfdfe; --card: #ffffff; --foreground: #1d384a; --muted: #f1f5f9; --muted-foreground: #64748b;
  --border: #e2e8f0; --primary: #1d384a; --primary-foreground: #ffffff; --destructive: #dc2626; --success: #16a34a;
  --font: 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --board: #0f171e; --ink: #e3eaf0; --ink-soft: #95a5b5; --rule: #24323e; --pick: #4fd3e6; --bezel: #33475a; color-scheme: dark; }
}
:root[data-theme="dark"] { --board: #0f171e; --ink: #e3eaf0; --ink-soft: #95a5b5; --rule: #24323e; --pick: #4fd3e6; --bezel: #33475a; color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--board); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
h1, h2, h3, p { margin: 0; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
.wrap { max-width: 1480px; margin: 0 auto; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); padding-block: 36px 72px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 56px; }
h1 { font-size: 28px; line-height: 1.2; letter-spacing: -0.02em; }
section.row { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; border-top: 1px solid var(--rule); padding-top: 24px; }
h2 { font-size: 20px; line-height: 1.3; font-weight: 600; }
.screens { display: flex; flex-wrap: wrap; gap: 32px 28px; align-items: flex-start; }
figure { margin: 0; display: grid; gap: 10px; }
figcaption { display: flex; gap: 8px; align-items: baseline; min-height: 24px; font-size: 14px; color: var(--ink-soft); }
figcaption b { color: var(--ink); font-weight: 600; }
figcaption .pick { color: var(--pick); font-weight: 600; }
figcaption button { margin-left: auto; text-decoration: underline; text-underline-offset: 3px; }
.scroll { overflow-x: auto; }

/* ---------- devices ---------- */
.phone { zoom: 0.8; width: 406px; padding: 8px; border-radius: 48px; background: var(--bezel); }
.screen { position: relative; overflow: hidden; width: 390px; height: 844px; border-radius: 40px; background: var(--background); color: var(--foreground); font-size: 14px; line-height: 1.6; color-scheme: light; }
.status { position: absolute; inset: 0 0 auto; height: 44px; background: #fff; z-index: 5; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 14px; }
.home-bg { position: absolute; inset: 44px 0 0; background: var(--homeimg) top / 390px auto no-repeat; }
.navbar { position: absolute; inset-inline: 0; height: 57px; background: var(--background); border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: flex-end; padding-inline: 18px; color: var(--muted-foreground); z-index: 2; }
#r2 { gap: 28px 20px; }
#r2 .phone { zoom: 0.665; }
.s-body ~ .toast { bottom: 28px; }
.homebar { position: absolute; left: 50%; bottom: 8px; width: 134px; height: 5px; margin-left: -67px; border-radius: 3px; background: #1d384a; z-index: 30; pointer-events: none; }
.deck { position: absolute; inset: auto 0 0; z-index: 3; display: flex; flex-direction: column; }
.deck .navbar { position: static; flex-shrink: 0; }
.desk { width: 1280px; zoom: 0.8; border-radius: 10px; overflow: hidden; background: var(--background); color: var(--foreground); border: 1px solid var(--rule); font-size: 14px; line-height: 1.6; color-scheme: light; position: relative; }

/* ---------- CRD pieces ---------- */
svg.i { width: 16px; height: 16px; flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.btn { display: inline-flex; align-items: center; justify-content: center; height: 44px; padding-inline: 16px; border-radius: 4px; border: 1px solid var(--primary); font-size: 12px; line-height: 1.25; font-weight: 500; text-transform: uppercase; white-space: nowrap; }
.btn.solid { background: var(--primary); color: var(--primary-foreground); }
.btn.outline { background: var(--background); border-color: var(--border); color: var(--foreground); }
.btn.ghost { border-color: transparent; }
.btn.sm { height: 36px; }
.btn:focus-visible, .sw:focus-visible, .inl:focus-visible, .lnk:focus-visible, .back:focus-visible, .head:focus-visible { outline: 3px solid rgba(29, 56, 74, 0.45); outline-offset: 2px; }
.pair { display: flex; flex-wrap: wrap; gap: 8px; }
.pair .btn { flex: 1 1 calc(50% - 4px); min-width: max-content; }
.sheet { background: var(--card); border-top: 1px solid var(--border); border-radius: 16px 16px 0 0; box-shadow: 0 -8px 24px -6px rgba(15, 23, 42, 0.18); padding: 16px 16px 34px; display: flex; flex-direction: column; gap: 12px; }
.sheet.titled { padding-top: 4px; gap: 4px; }
.sheet.titled .pair { margin-top: 8px; }
.sheet.below { gap: 4px; }
.sheet.below .pair { margin-top: 8px; }
.sheet .titlerow { display: flex; align-items: center; justify-content: space-between; min-height: 44px; }
.inl { font-weight: 500; text-decoration: underline; text-underline-offset: 3px; position: relative; }
.inl::after { content: ""; position: absolute; inset: -11px -8px; }
.sheet .titlerow .btn { margin-right: -16px; }
.sheet h3, .tall h3 { font-size: 16px; line-height: 1.5; font-weight: 600; }
.err { display: flex; gap: 8px; align-items: flex-start; color: #b91c1c; font-size: 14px; line-height: 1.5; padding: 10px 12px; border: 1px solid rgba(220, 38, 38, 0.3); background: rgba(220, 38, 38, 0.05); border-radius: 6px; margin-top: 8px; }
.err svg { margin-top: 3px; }
.today { background: var(--card); border-top: 1px solid var(--border); box-shadow: 0 10px 15px -3px rgba(0,0,0,.1); padding: 16px 16px 16px; display: flex; flex-wrap: wrap; gap: 16px; }
.today p { min-width: 300px; flex: 1; }
.today .btns { display: flex; gap: 8px; }
.today .btn { height: 36px; }
.tall { position: absolute; inset: auto 0 0; z-index: 20; background: var(--card); border-radius: 16px 16px 0 0; box-shadow: 0 -8px 24px -6px rgba(15,23,42,.25); display: flex; flex-direction: column; max-height: 76%; }
.tall .bar { width: 36px; height: 4px; border-radius: 2px; background: #cbd5e1; margin: 8px auto 0; flex-shrink: 0; }
.tall .titlerow { display: flex; align-items: center; min-height: 48px; padding-inline: 4px 16px; flex-shrink: 0; }
.back { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 4px; }
.back svg { width: 20px; height: 20px; }
.tall .body { padding: 0 16px; overflow-y: auto; min-height: 0; }
.tall .foot { padding: 12px 16px 34px; border-top: 1px solid var(--border); flex-shrink: 0; }
.tall .foot .btn { width: 100%; }
.opt { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding-block: 14px; border-bottom: 1px solid var(--border); }
.opt > div { min-width: 0; }
.opt .n { font-weight: 500; line-height: 1.5; }
.opt .d { font-size: 12px; line-height: 1.5; color: var(--muted-foreground); margin-top: 2px; }
.locked { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex-shrink: 0; }
.sw:disabled { opacity: 0.5; cursor: not-allowed; }
.always { font-size: 12px; line-height: 1.5; color: var(--muted-foreground); white-space: nowrap; }
.sw { position: relative; width: 32px; height: 18.4px; border-radius: 999px; background: rgba(100,116,139,.25); flex-shrink: 0; margin-top: 2px; }
.sw::before { content: ""; position: absolute; inset: -13px -6px; }
.sw::after { content: ""; position: absolute; top: 1px; left: 1px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .15s; }
.sw[aria-checked="true"] { background: var(--primary); }
.sw[aria-checked="true"]::after { transform: translateX(14px); }
@media (prefers-reduced-motion: reduce) { .sw::after { transition: none; } }
.links { display: flex; flex-wrap: wrap; gap: 4px 20px; padding-block: 12px; }
.lnk { display: inline-flex; align-items: center; gap: 4px; min-height: 28px; font-size: 12px; font-weight: 500; color: var(--primary); text-decoration: none; }
.lnk svg { width: 14px; height: 14px; }
.toast { position: absolute; z-index: 25; inset: auto 16px 86px; background: #fff; border: 1px solid var(--border); border-left: 4px solid var(--success); border-radius: 8px; box-shadow: 0 4px 12px rgba(0,0,0,.1); padding: 14px 16px; display: flex; gap: 8px; align-items: center; font-size: 13px; font-weight: 500; line-height: 1.5; }
.desk .toast { inset: auto 24px 24px auto; width: 356px; }

/* ---------- settings section ---------- */
.sec { border: 1px solid var(--border); border-radius: 6px; background: var(--card); }
.sec .head { display: flex; align-items: center; gap: 12px; padding: 20px 24px; width: 100%; text-align: left; border-radius: 6px; }
.sec .tile { width: 36px; height: 36px; border-radius: 6px; display: grid; place-items: center; flex-shrink: 0; }
.tile.orange { background: #ffedd5; color: #ea580c; }
.tile.rose { background: #ffe4e6; color: #e11d48; }
.sec .head .t { flex: 1; min-width: 0; }
.sec .head .t b { display: block; font-size: 18px; line-height: 1.4; font-weight: 600; }
.sec .head .t span { display: block; margin-top: 2px; color: var(--muted-foreground); }
.sec .head > svg { width: 20px; height: 20px; color: var(--muted-foreground); }
.sec .in { padding: 0 24px 12px; }
.sec .opt:first-child { padding-top: 0; }
.infobox { display: flex; gap: 8px; border: 1px solid var(--border); border-radius: 4px; background: rgba(241,245,249,.3); color: var(--muted-foreground); padding: 16px; margin-bottom: 12px; }
.infobox svg { margin-top: 3px; }
.s-head { position: absolute; inset: 44px 0 auto; height: 210px; background: var(--secmimg) top / 390px auto no-repeat; z-index: 4; }
.s-slice { height: 172px; background: var(--secmimg) 0 -420px / 390px auto no-repeat; }
.s-body { position: absolute; inset: 254px 0 0; display: flex; flex-direction: column; overflow: hidden; }
.s-body .pad { padding: 24px 24px 0; }
.d-top { height: 625px; background: var(--secdimg) top left / 1280px auto no-repeat; }
.d-sec { margin: 24px 149px 64px 134px; }
</style>

<script>
const I = {
  cookie: '<path d="M11 17h.01M12 12h.01M16 16h.01M16 3h.01M21 4h.01M21 8h.01M7 14h.01M9 8h.01"/><path d="M11.496 2c.324-.016.558.292.529.615a4 4 0 0 0 4.235 4.368.713.713 0 0 1 .758.757 4 4 0 0 0 4.366 4.237c.323-.03.63.204.614.527a10 10 0 0 1-2.915 6.566A1 1 0 1 1 4.93 4.918 10 10 0 0 1 11.496 2"/>',
  up: '<path d="m18 15-6-6-6 6"/>', left: '<path d="m15 18-6-6 6-6"/>', menu: '<path d="M4 5h16M4 12h16M4 19h16"/>',
  ok: '<circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>', alert: '<circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/>',
  info: '<circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>', ext: '<path d="M7 7h10v10M7 17 17 7"/>',
  shield: '<path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="M12 8v4M12 16h.01"/>'
};
const ic = n => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${I[n]}</svg>`;
const T = {
  en: { title: 'Cookies', short: 'We use necessary cookies. With your permission, we also measure page speed and app usage. That is off unless you accept.',
    full: 'We use necessary cookies to keep you signed in and secure, and we report errors so we can fix them. With your permission, we also measure page speed and app usage to find slow pages. This is off unless you accept, and you can change it any time in Cookie settings.',
    all: 'Accept all', nec: 'Only necessary', set: 'Settings' },
  de: { title: 'Cookies', short: 'Wir verwenden notwendige Cookies. Mit Ihrer Erlaubnis messen wir auch die Seitengeschwindigkeit und die App-Nutzung. Das ist aus, solange Sie nicht zustimmen.', all: 'Alle akzeptieren', nec: 'Nur notwendige', set: 'Einstellungen' },
  bg: { title: 'Бисквитки', short: 'Използваме необходими бисквитки. С ваше разрешение измерваме и скоростта на страниците и използването на приложението. Изключено е, докато не приемете.', all: 'Приемане на всички', nec: 'Само необходимите', set: 'Настройки' }
};
const links = `<div class="links"><a class="lnk" href="#" data-a="noop">Cookie policy ${ic('ext')}</a><a class="lnk" href="#" data-a="noop">Privacy policy ${ic('ext')}</a></div>`;
const opts = on => `<div class="opt"><div><p class="n">Necessary</p><p class="d">Keeps you signed in and secure, reports errors so we can fix them, and remembers this choice.</p></div><div class="locked"><button class="sw" type="button" role="switch" aria-label="Necessary, always on" aria-checked="true" disabled></button><span class="always">Always on</span></div></div>
  <div class="opt"><div><p class="n">Analytics</p><p class="d">Measures page speed and app usage. Off unless you turn it on.</p></div><button class="sw" type="button" role="switch" aria-label="Analytics" aria-checked="${on}" data-a="toggle"></button></div>`;
const toast = `<div class="toast" role="status">${ic('ok')}<span>Your cookie choice is saved.</span></div>`;
const nav = `<div class="navbar">${ic('menu')}</div>`;
const status = '<div class="status">9:41</div>';

function banner(s) {
  const t = T[s.lang || 'en'], k = s.style;
  const pair = `<div class="pair"><button class="btn ${k}" type="button" data-a="all">${t.all}</button><button class="btn ${k}" type="button" data-a="nec">${t.nec}</button></div>`;
  const err = s.view === 'error' ? `<div class="err" role="alert">${ic('alert')}<span>We couldn’t save your choice. Your browser may be blocking cookies for this site.</span></div>` : '';
  const set = `<button class="btn ghost" type="button" data-a="settings">${t.set}</button>`;
  if (s.kind === 'titled') return `<div class="sheet titled" role="region" aria-label="Cookies"><div class="titlerow"><h3>${t.title}</h3>${set}</div><p>${t.short}</p>${err}${pair}</div>`;
  if (s.kind === 'inline') return `<div class="sheet" role="region" aria-label="Cookies"><p>${t.short} <button class="inl" type="button" data-a="settings">${t.set}</button></p>${err}${pair}</div>`;
  return `<div class="sheet below" role="region" aria-label="Cookies"><p>${s.kind === 'full' ? t.full : t.short}</p>${err}${pair}${set}</div>`;
}
function home(s) {
  let o = status + '<div class="home-bg"></div>';
  if (s.kind === 'today') return o + `<div class="deck"><div class="today"><p>By clicking "Accept All Cookies", you agree to the storing of cookies on your device to enhance site navigation and analyse site usage.</p><div class="btns"><span class="btn outline">settings</span><span class="btn solid">Accept All Cookies</span></div></div></div><div class="homebar"></div>`;
  if (s.view === 'saved') return o + `<div class="deck">${nav}</div>` + toast + '<div class="homebar"></div>';
  o += `<div class="deck">${nav}${banner(s)}</div>`;
  if (s.view === 'settings') o += `<div class="tall" role="dialog" aria-label="Cookie settings"><div class="bar"></div><div class="titlerow"><button class="back" type="button" aria-label="Back" data-a="back">${ic('left')}</button><h3>Cookie settings</h3></div><div class="body">${opts(!!s.on)}${links}</div><div class="foot"><button class="btn solid" type="button" data-a="nec">Save choice</button></div></div>`;
  return o + '<div class="homebar"></div>';
}
const sec = s => `<div class="sec"><div class="head"><span class="tile orange">${ic('cookie')}</span><span class="t"><b>Cookie settings</b><span>What Alkemio may store and measure on this device.</span></span>${ic('up')}</div><div class="in">${opts(!!s.on)}${links}</div></div>`;
const R = {
  home,
  web: s => status + `<div class="s-head"></div><div class="s-body"><div class="s-slice"></div><div style="padding:0 24px;margin-top:24px">${sec(s)}</div></div>${s.toast ? toast : ''}<div class="homebar"></div>`,
  app: s => status + `<div class="s-head"></div><div class="s-body"><div class="pad"><div class="sec"><div class="head"><span class="tile rose">${ic('shield')}</span><span class="t"><b>Security</b></span></div><div class="in" style="padding-bottom:12px"><div class="infobox">${ic('info')}<p>Your password, passkeys, two-step verification and connected accounts are managed in a web browser, not in the app.</p></div></div></div></div><div class="pad">${sec(s)}</div></div>${s.toast ? toast : ''}<div class="homebar"></div>`,
  desk: s => `<div class="d-top"></div><div class="d-sec">${sec(s)}</div>${s.toast ? toast : ''}`
};
function live(el, screen, init, resetBtn) {
  let s = { ...init };
  const draw = () => { el.innerHTML = R[screen](s); if (resetBtn) resetBtn.hidden = JSON.stringify(s) === JSON.stringify(init); };
  el.addEventListener('click', e => {
    const b = e.target.closest('[data-a]'); if (!b) return;
    e.preventDefault();
    const a = b.dataset.a;
    if (a === 'noop') return;
    if (a === 'toggle') { s.on = !s.on; if (screen !== 'home') s.toast = true; }
    if (a === 'settings') s.view = 'settings';
    if (a === 'back') s.view = 'banner';
    if (a === 'all' || a === 'nec') s.view = 'saved';
    draw();
    if (a === 'toggle') el.querySelector('[data-a=toggle]').focus({ preventScroll: true });
  });
  if (resetBtn) resetBtn.addEventListener('click', () => { s = { ...init }; draw(); });
  draw();
}
function phone(row, cap, screen, init, fixed) {
  const f = document.createElement('figure');
  f.innerHTML = `<figcaption>${cap}<button type="button" hidden>Reset</button></figcaption><div class="phone"><div class="screen"></div></div>`;
  document.getElementById(row).append(f);
  live(f.querySelector('.screen'), screen, init, f.querySelector('button'));
}
const pick = { kind: 'titled', style: 'solid', view: 'banner' };
phone('r1', '<b>Today</b>', 'home', { kind: 'today' });
phone('r1', '<b>A</b> Settings on top <span class="pick">My pick</span>', 'home', pick);
phone('r1', '<b>B</b> Settings in the text', 'home', { kind: 'inline', style: 'outline', view: 'banner' });
phone('r1', '<b>C</b> Ticket’s full text', 'home', { kind: 'full', style: 'outline', view: 'banner' });
phone('r2', '<b>Settings</b>', 'home', { ...pick, view: 'settings' });
phone('r2', '<b>Choice saved</b>', 'home', { ...pick, view: 'saved' });
phone('r2', '<b>Save failed</b>', 'home', { ...pick, view: 'error' });
phone('r2', '<b>German</b>', 'home', { ...pick, lang: 'de' });
phone('r2', '<b>Bulgarian</b> buttons stack', 'home', { ...pick, lang: 'bg' });
phone('r3', '<b>Mobile web</b>', 'web', { on: true });
phone('r3', '<b>App</b>', 'app', { on: false });
phone('r3', '<b>Switched off</b>', 'web', { on: false, toast: true });
live(document.getElementById('desk'), 'desk', { on: true });
</script>

<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1280 720' width='1280' height='720'><rect width='1280' height='720' fill='#e8eaed'/><rect x='292' y='40' width='696' height='720' fill='#000' opacity='0.06' transform='translate(0 4)'/><rect x='290' y='36' width='700' height='740' fill='#fff'/><text x='360' y='100' font-family='Inter, Helvetica, Arial, sans-serif' font-size='13' fill='#1a73e8' font-weight='600' letter-spacing='1.5'>GUIDELINES · FOR REVIEW</text><text x='360' y='144' font-family='Inter, Helvetica, Arial, sans-serif' font-size='30' fill='#202124' font-weight='700'>Procurement Guidelines</text><text x='360' y='174' font-family='Inter, Helvetica, Arial, sans-serif' font-size='15' fill='#5f6368'>Power purchase agreements and renewable energy contracts</text><rect x='360' y='196' width='560' height='2' fill='#1a73e8'/><text x='360' y='236' font-family='Inter, Helvetica, Arial, sans-serif' font-size='17' fill='#202124' font-weight='600'>1. Purpose</text><text x='360' y='264' font-family='Inter, Helvetica, Arial, sans-serif' font-size='14' fill='#3c4043'>These guidelines describe how departments buy renewable energy and</text><text x='360' y='287' font-family='Inter, Helvetica, Arial, sans-serif' font-size='14' fill='#3c4043'>related services, so that contracts are comparable, transparent and</text><text x='360' y='310' font-family='Inter, Helvetica, Arial, sans-serif' font-size='14' fill='#3c4043'>aligned with the 2030 transition policy.</text><text x='360' y='351' font-family='Inter, Helvetica, Arial, sans-serif' font-size='17' fill='#202124' font-weight='600'>2. Principles</text><text x='376' y='379' font-family='Inter, Helvetica, Arial, sans-serif' font-size='14' fill='#3c4043'>• Open tender for any contract above €250,000</text><text x='376' y='402' font-family='Inter, Helvetica, Arial, sans-serif' font-size='14' fill='#3c4043'>• Minimum contract term of 10 years for PPAs</text><text x='376' y='425' font-family='Inter, Helvetica, Arial, sans-serif' font-size='14' fill='#3c4043'>• Local supplier preference where cost difference is under 5%</text><text x='376' y='448' font-family='Inter, Helvetica, Arial, sans-serif' font-size='14' fill='#3c4043'>• Annual reporting on delivered versus contracted volume</text><text x='360' y='489' font-family='Inter, Helvetica, Arial, sans-serif' font-size='17' fill='#202124' font-weight='600'>3. Evaluation criteria</text><text x='360' y='517' font-family='Inter, Helvetica, Arial, sans-serif' font-size='14' fill='#3c4043'>Bids are scored on price (40%), delivery certainty (25%), local</text></svg>
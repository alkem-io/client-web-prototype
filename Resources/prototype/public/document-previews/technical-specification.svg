<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1280 720' width='1280' height='720'><rect width='1280' height='720' fill='#e8eaed'/><rect x='292' y='40' width='696' height='720' fill='#000' opacity='0.06' transform='translate(0 4)'/><rect x='290' y='36' width='700' height='740' fill='#fff'/><text x='360' y='100' font-family='Inter, Helvetica, Arial, sans-serif' font-size='13' fill='#1a73e8' font-weight='600' letter-spacing='1.5'>TECHNICAL SPECIFICATION · v2.1</text><text x='360' y='144' font-family='Inter, Helvetica, Arial, sans-serif' font-size='30' fill='#202124' font-weight='700'>Rooftop Solar Installation Spec</text><text x='360' y='174' font-family='Inter, Helvetica, Arial, sans-serif' font-size='15' fill='#5f6368'>Standards for municipal and community rooftop installations</text><rect x='360' y='196' width='560' height='2' fill='#1a73e8'/><text x='360' y='236' font-family='Inter, Helvetica, Arial, sans-serif' font-size='17' fill='#202124' font-weight='600'>1. Scope</text><text x='360' y='264' font-family='Inter, Helvetica, Arial, sans-serif' font-size='14' fill='#3c4043'>Applies to all photovoltaic installations between 10 kWp and 500 kWp</text><text x='360' y='287' font-family='Inter, Helvetica, Arial, sans-serif' font-size='14' fill='#3c4043'>on municipal buildings, schools and community-owned rooftops.</text><text x='360' y='328' font-family='Inter, Helvetica, Arial, sans-serif' font-size='17' fill='#202124' font-weight='600'>2. Equipment requirements</text><text x='376' y='356' font-family='Inter, Helvetica, Arial, sans-serif' font-size='14' fill='#3c4043'>• Panels: monocrystalline, ≥ 21% efficiency, 25-year warranty</text><text x='376' y='379' font-family='Inter, Helvetica, Arial, sans-serif' font-size='14' fill='#3c4043'>• Inverters: grid-forming capable, remote monitoring</text><text x='376' y='402' font-family='Inter, Helvetica, Arial, sans-serif' font-size='14' fill='#3c4043'>• Mounting: ballasted where roof load permits, no penetrations</text><text x='360' y='443' font-family='Inter, Helvetica, Arial, sans-serif' font-size='17' fill='#202124' font-weight='600'>3. Installation procedure</text><text x='360' y='471' font-family='Inter, Helvetica, Arial, sans-serif' font-size='14' fill='#3c4043'>3.1 Structural survey and load calculation</text><text x='360' y='494' font-family='Inter, Helvetica, Arial, sans-serif' font-size='14' fill='#3c4043'>3.2 Electrical design and grid operator approval</text><text x='360' y='517' font-family='Inter, Helvetica, Arial, sans-serif' font-size='14' fill='#3c4043'>3.3 Installation, commissioning and handover</text></svg>
<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1280 720' width='1280' height='720'><rect width='1280' height='720' fill='#e8eaed'/><rect x='292' y='40' width='696' height='720' fill='#000' opacity='0.06' transform='translate(0 4)'/><rect x='290' y='36' width='700' height='740' fill='#fff'/><text x='360' y='100' font-family='Inter, Helvetica, Arial, sans-serif' font-size='13' fill='#1a73e8' font-weight='600' letter-spacing='1.5'>POLICY PROPOSAL · DRAFT 3</text><text x='360' y='144' font-family='Inter, Helvetica, Arial, sans-serif' font-size='30' fill='#202124' font-weight='700'>2030 Renewable Transition Policy</text><text x='360' y='174' font-family='Inter, Helvetica, Arial, sans-serif' font-size='15' fill='#5f6368'>Municipal Energy Office — prepared for council review, March 2026</text><rect x='360' y='196' width='560' height='2' fill='#1a73e8'/><text x='360' y='236' font-family='Inter, Helvetica, Arial, sans-serif' font-size='17' fill='#202124' font-weight='600'>1. Executive summary</text><text x='360' y='264' font-family='Inter, Helvetica, Arial, sans-serif' font-size='14' fill='#3c4043'>This proposal sets out how the municipality reaches 80% renewable</text><text x='360' y='287' font-family='Inter, Helvetica, Arial, sans-serif' font-size='14' fill='#3c4043'>electricity by 2030 through four programmes: grid modernisation,</text><text x='360' y='310' font-family='Inter, Helvetica, Arial, sans-serif' font-size='14' fill='#3c4043'>community solar, building electrification and fleet conversion.</text><text x='360' y='351' font-family='Inter, Helvetica, Arial, sans-serif' font-size='17' fill='#202124' font-weight='600'>2. Programmes and budget</text><text x='376' y='379' font-family='Inter, Helvetica, Arial, sans-serif' font-size='14' fill='#3c4043'>• Grid modernisation — €14.2M over five years</text><text x='376' y='402' font-family='Inter, Helvetica, Arial, sans-serif' font-size='14' fill='#3c4043'>• Community solar — €6.8M, co-funded by state incentives</text><text x='376' y='425' font-family='Inter, Helvetica, Arial, sans-serif' font-size='14' fill='#3c4043'>• Building electrification — €9.1M in retrofit grants</text><text x='376' y='448' font-family='Inter, Helvetica, Arial, sans-serif' font-size='14' fill='#3c4043'>• Fleet conversion — €4.5M, 120 vehicles by 2029</text><text x='360' y='489' font-family='Inter, Helvetica, Arial, sans-serif' font-size='17' fill='#202124' font-weight='600'>3. Timeline</text><text x='360' y='517' font-family='Inter, Helvetica, Arial, sans-serif' font-size='14' fill='#3c4043'>Phase one starts in Q3 2026 with the grid study and the first</text></svg>